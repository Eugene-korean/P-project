name: conditions-doc

# main에 조건 파일(configs/**.json)이 push되면 docs/CONDITIONS.md를 다시 만들어 자동 커밋한다.
# 공용 PC가 아니라 GitHub 서버에서 돈다 (실험에 영향 없음).
# 이 커밋은 GitHub이 막아 줘서 다른 실행을 다시 부르지 않는다.
on:
  push:
    branches: [main]
    paths: ["configs/**.json"]
  workflow_dispatch:            # 손으로 다시 만들 때 (Use workflow from에서 고른 브랜치에 커밋)

concurrency:
  group: conditions-doc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest      # GitHub 서버 (공용 PC 아님)
    timeout-minutes: 5
    permissions:
      contents: write           # 이 작업에만 커밋 권한
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild docs/CONDITIONS.md
        run: python3 scripts/list_configs.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/CONDITIONS.md && [ -z "$(git status --porcelain -- docs/CONDITIONS.md)" ]; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CONDITIONS.md
          git commit -m "Update CONDITIONS.md"
          for i in 1 2 3; do
            git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          echo "push 실패 (다른 커밋과 겹침). Actions에서 conditions-doc을 다시 실행하세요."; exit 1